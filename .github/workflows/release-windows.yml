name: Stable Windows release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: stable-windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deterministic-tests:
    uses: ./.github/workflows/deterministic-tests.yml
    permissions:
      contents: read

  release:
    if: ${{ needs.deterministic-tests.result == 'success' }}
    needs: deterministic-tests
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\src\FusionCanvas.App\FusionCanvas.App.csproj --runtime win-x64 --nologo

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          New-Item -ItemType Directory -Force -Path $publishDirectory | Out-Null
          dotnet publish .\src\FusionCanvas.App\FusionCanvas.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --nologo `
            --output $publishDirectory `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Download pinned NSIS compiler
        id: nsis
        shell: pwsh
        run: |
          $nsisVersion = "3.13"
          $nsisUrl = "https://sourceforge.net/projects/nsis/files/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip/download"
          $expectedHash = "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8"
          $archivePath = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion.zip"
          $extractDirectory = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion"
          Invoke-WebRequest -Uri $nsisUrl -Headers @{ 'User-Agent' = 'FusionCanvas-build/1.0' } -OutFile $archivePath
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "NSIS archive checksum mismatch." }
          if (Test-Path -LiteralPath $extractDirectory) { Remove-Item -LiteralPath $extractDirectory -Recurse -Force }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDirectory
          $makensis = Get-ChildItem -LiteralPath $extractDirectory -Filter "makensis.exe" -Recurse | Select-Object -First 1
          if ($null -eq $makensis) { throw "The pinned NSIS archive did not contain makensis.exe." }
          "makensis=$($makensis.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer, checksum, and release manifest
        id: release-assets
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.FUSIONCANVAS_WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.FUSIONCANVAS_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          $version = (dotnet msbuild .\src\FusionCanvas.App\FusionCanvas.App.csproj -target:GetBuildVersion -getProperty:NuGetPackageVersion -nologo | Out-String).Trim()
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $tagVersion) {
            throw "The release tag '$env:GITHUB_REF_NAME' does not match the stable application version '$version'."
          }
          $versionMatch = [regex]::Match($version, '^(\d+)\.(\d+)\.(\d+)$')
          $fileVersion = "$($versionMatch.Groups[1].Value).$($versionMatch.Groups[2].Value).$($versionMatch.Groups[3].Value).0"
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $installerName = "FusionCanvas-$version-win-x64-Setup.exe"
          $installerPath = Join-Path $artifactDirectory $installerName
          $iconPath = Join-Path $env:GITHUB_WORKSPACE "src\FusionCanvas.App\Assets\FusionCanvasLogo_Square_LightBg.ico"
          & "${{ steps.nsis.outputs.makensis }}" "/DAPP_VERSION=$version" "/DFILE_VERSION=$fileVersion" "/DPUBLISH_DIRECTORY=$publishDirectory" "/DOUTFILE=$installerPath" "/DICON_PATH=$iconPath" ".\installer\FusionCanvas.nsi"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $installerPath -PathType Leaf)) { throw "NSIS did not produce the expected installer." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Windows signing secrets are required before a stable release can be published."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "fusioncanvas-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signTool) { throw "The Windows SDK signing tool was not found." }
          & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installerPath
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          $signature = Get-AuthenticodeSignature -FilePath $installerPath
          if ($signature.Status -ne "Valid" -or $null -eq $signature.SignerCertificate) { throw "The signed installer did not pass Windows Authenticode validation." }
          $publisherCertificateSha256 = $signature.SignerCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
          $checksum = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumName = "$installerName.sha256"
          "$checksum  $installerName" | Set-Content -LiteralPath (Join-Path $artifactDirectory $checksumName) -Encoding ascii -NoNewline
          $manifest = [ordered]@{
            schemaVersion = 2
            productVersion = $version
            platform = "win-x64"
            installerUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$installerName"
            sha256 = $checksum
            releaseUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
            publisherCertificateSha256 = $publisherCertificateSha256
          }
          $manifestName = "latest.json"
          $manifest | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $artifactDirectory $manifestName) -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer=$installerName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$checksumName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest=$manifestName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release trust policy in a disposable install
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP "FusionCanvas-ReleaseTrustSmoke\install"
          .\tools\updates\Test-FusionCanvasRelease.ps1 `
            -ManifestPath "artifacts\${{ steps.release-assets.outputs.manifest }}" `
            -InstallerPath "artifacts\${{ steps.release-assets.outputs.installer }}" `
            -ExpectedVersion "${{ steps.release-assets.outputs.version }}" `
            -InstallDirectory $installDirectory

      - name: Attest installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ steps.release-assets.outputs.installer }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts\${{ steps.release-assets.outputs.installer }}" `
            "artifacts\${{ steps.release-assets.outputs.checksum }}" `
            "artifacts\${{ steps.release-assets.outputs.manifest }}" `
            --title "FusionCanvas ${{ steps.release-assets.outputs.version }}" `
            --generate-notes

      - name: Summarize stable release
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Stable Windows release"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Version: **${{ steps.release-assets.outputs.version }}**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Installer: **${{ steps.release-assets.outputs.installer }}**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Manifest: **latest.json**"
