name: Native credential smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "src/FusionCanvas.Integration/AI/NativeAiCredentialStore.cs"
      - "tests/FusionCanvas.Integration.Tests/AI/NativeCredentialSmokeTests.cs"
      - ".github/workflows/native-credential-smoke.yml"

permissions:
  contents: read

jobs:
  native-credential:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Provision Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0

      - name: Provision isolated macOS keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "FUSIONCANVAS_ORIGINAL_KEYCHAIN=$(security default-keychain -d user | tr -d '"')" >> "$GITHUB_ENV"
          security create-keychain -p fusioncanvas "$RUNNER_TEMP/fusioncanvas-tests.keychain-db"
          security unlock-keychain -p fusioncanvas "$RUNNER_TEMP/fusioncanvas-tests.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/fusioncanvas-tests.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/fusioncanvas-tests.keychain-db"

      - name: Run Windows/macOS native smoke
        if: runner.os != 'Linux'
        shell: pwsh
        env:
          FUSIONCANVAS_NATIVE_CREDENTIAL_SMOKE: "1"
        run: dotnet test ./tests/FusionCanvas.Integration.Tests/FusionCanvas.Integration.Tests.csproj --filter FullyQualifiedName~NativeCredentialSmokeTests

      - name: Run Linux native smoke in isolated D-Bus session
        if: runner.os == 'Linux'
        env:
          FUSIONCANVAS_NATIVE_CREDENTIAL_SMOKE: "1"
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "\n" | gnome-keyring-daemon --unlock
            dotnet test ./tests/FusionCanvas.Integration.Tests/FusionCanvas.Integration.Tests.csproj --filter FullyQualifiedName~NativeCredentialSmokeTests
          '

      - name: Remove isolated macOS keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security default-keychain -d user -s "$FUSIONCANVAS_ORIGINAL_KEYCHAIN"
          security delete-keychain "$RUNNER_TEMP/fusioncanvas-tests.keychain-db" || true
