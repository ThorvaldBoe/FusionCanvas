name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: deterministic-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-tests:
    uses: ./.github/workflows/deterministic-tests.yml
    permissions:
      contents: read

  failure-tracking:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: deterministic-tests
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure tracking issue
        if: needs.deterministic-tests.result == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $issueTitle = "CI: deterministic tests failing"
          $repository = $env:GITHUB_REPOSITORY
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $existingIssue = gh issue list --repo $repository --state open --limit 100 --json number,title --jq '.[] | select(.title == "CI: deterministic tests failing") | .number' | Select-Object -First 1
          $body = @"
          The scheduled or manually dispatched deterministic solution test baseline failed.

          Run: $runUrl
          Commit: $env:GITHUB_SHA
          Branch: $env:GITHUB_REF_NAME

          Download the TRX test-result artifact from the run for diagnostics. Keep the workflow failed until the underlying failure is understood and corrected.
          "@
          if ([string]::IsNullOrWhiteSpace($existingIssue)) {
            gh issue create --repo $repository --title $issueTitle --body $body
          }
          else {
            gh issue comment $existingIssue.Trim() --repo $repository --body $body
          }

      - name: Close recovered failure tracking issue
        if: needs.deterministic-tests.result == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $issueTitle = "CI: deterministic tests failing"
          $repository = $env:GITHUB_REPOSITORY
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $existingIssue = gh issue list --repo $repository --state open --limit 100 --json number,title --jq '.[] | select(.title == "CI: deterministic tests failing") | .number' | Select-Object -First 1
          if (-not [string]::IsNullOrWhiteSpace($existingIssue)) {
            $comment = "The deterministic solution test baseline recovered successfully. Run: $runUrl"
            gh issue close $existingIssue.Trim() --repo $repository --comment $comment
          }
