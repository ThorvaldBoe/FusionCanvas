name: Windows package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-tests:
    uses: ./.github/workflows/deterministic-tests.yml
    permissions:
      contents: read

  package:
    if: ${{ needs.deterministic-tests.result == 'success' }}
    needs: deterministic-tests
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\src\FusionCanvas.App\FusionCanvas.App.csproj --runtime win-x64 --nologo
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          New-Item -ItemType Directory -Force -Path $publishDirectory | Out-Null

          dotnet publish .\src\FusionCanvas.App\FusionCanvas.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --nologo `
            --output $publishDirectory `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Package and checksum
        id: package
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          $assemblyPath = Join-Path $publishDirectory "FusionCanvas.App.dll"
          if (-not (Test-Path $assemblyPath)) {
            throw "Published application assembly was not found at $assemblyPath."
          }

          $version = (dotnet msbuild .\src\FusionCanvas.App\FusionCanvas.App.csproj `
            -target:GetBuildVersion `
            -getProperty:NuGetPackageVersion `
            -nologo | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or
              $version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Unexpected application package version '$version'."
          }

          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $archiveName = "FusionCanvas-$version-win-x64.zip"
          $archivePath = Join-Path $artifactDirectory $archiveName
          Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $archivePath -CompressionLevel Optimal

          $checksum = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          "$checksum  $archiveName" | Set-Content -Path $checksumPath -Encoding ascii -NoNewline

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$([IO.Path]::GetFileName($checksumPath))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows package"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Version: **$version**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Artifact: **$archiveName**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SHA-256: **$checksum**"
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ steps.package.outputs.archive }}
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FusionCanvas-${{ steps.package.outputs.version }}-win-x64
          path: |
            artifacts/${{ steps.package.outputs.archive }}
            artifacts/${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
