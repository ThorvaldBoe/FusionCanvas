workflows:
  - workflow_id: WF-terms-first-launch
    name: Accept first-launch terms and responsible-use acknowledgements
    goal: Start the app after acknowledging FusionCanvas and provider policies.
    starting_conditions: [no current consent record, or stale consent record]
    expected_outcome: [consent is saved and the main window opens]
    journeys: [JOURNEY-fresh-install-to-app]
    views_and_entry_points: [TermsConsentWindow, App.InitializeStartupAsync]
    interactions: [read FusionCanvas terms, select required acknowledgements, open official policy links as needed, click Agree and continue]
    states_and_transitions: [loading, incomplete, complete, saving, save-error, accepted]
    persistence_and_consequences: [writes local application settings; releases startup gate]
    source_locations: [src/FusionCanvas.App/App.axaml.cs, src/FusionCanvas.App/TermsConsent/TermsConsentWindow.axaml, src/FusionCanvas.App/TermsConsent/TermsConsentViewModel.cs]
    tests: [tests/FusionCanvas.App.Tests/TermsConsent/TermsConsentWindowTests.cs, tests/FusionCanvas.App.Tests/TermsConsent/TermsConsentViewModelTests.cs]
  - workflow_id: WF-terms-settings-review
    name: Review terms from Settings
    goal: Inspect the current acknowledgement status and reopen the policy dialog.
    starting_conditions: [main window is running]
    expected_outcome: [status is understandable and review dialog opens]
    views_and_entry_points: [SettingsWindow, SettingsViewModel]
    interactions: [open Terms and responsible use, review status, click Review terms and policies]
    states_and_transitions: [current, missing, stale, review-dialog]
    persistence_and_consequences: [may update the local consent record]
    source_locations: [src/FusionCanvas.App/Settings/SettingsWindow.axaml, src/FusionCanvas.App/Settings/SettingsViewModel.cs]
    tests: [tests/FusionCanvas.App.Tests/TermsConsent/TermsConsentSettingsTests.cs]
