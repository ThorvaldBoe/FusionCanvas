<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="Catalog &amp; Mockups - Manage Design Areas">
  <rect width="100%" height="100%" fill="#f4f6f8" />
  <g data-ui-id="page" data-ui-kind="stack" data-enabled="true">
