          <text x="64" y="606" fill="#182536" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">No image selected</text>
        </g>
        <g data-ui-id="selected-image-status" data-ui-kind="message" data-enabled="true">
          <rect x="64" y="616" width="1152" height="48" rx="7" fill="#fff4dd" stroke="#d4a649" stroke-width="1" />
          <text x="76" y="644" fill="#765715" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">Select an image in the table to configure its metadata and placement.</text>
