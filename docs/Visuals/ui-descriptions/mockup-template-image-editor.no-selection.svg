      </g>
      <g data-ui-id="page-help" data-ui-kind="text" data-enabled="true">
        <text x="48" y="98" fill="#617087" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">Upload source images first, then configure each selected image independently.</text>
      </g>
    </g>
    <g data-ui-id="template-name-group" data-ui-kind="grid" data-enabled="true">
      <g data-ui-id="template-name-fields" data-ui-kind="stack" data-enabled="true">
