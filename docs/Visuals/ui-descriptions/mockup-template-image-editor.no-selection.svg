        <g data-ui-id="template-name" data-ui-kind="field" data-enabled="true">
          <rect x="48" y="142" width="580" height="38" rx="5" fill="#edf2f7" stroke="#9fb0c3" stroke-width="1" />
          <text x="60" y="166" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">Flatlay no. 1</text>
        </g>
      </g>
      <g data-ui-id="shared-design-area-fields" data-ui-kind="stack" data-enabled="true">
