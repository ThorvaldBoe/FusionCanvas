        <rect x="1051" y="1314" width="181" height="38" rx="7" fill="#214f7d" stroke="#214f7d" stroke-width="1" />
        <text x="1063" y="1338" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Save Mockup Template</text>
      </g>
    </g>
