          <text x="397" y="297" fill="#182536" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Applies to</text>
          <text x="718" y="297" fill="#182536" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Design area</text>
          <text x="908" y="297" fill="#182536" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Mapping</text>
          <text x="1058" y="297" fill="#182536" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Status</text>
        <rect x="64" y="310" width="1152" height="40" rx="0" fill="#ffffff" stroke="#d2d9e1" stroke-width="1" />
          <text x="76" y="337" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">black-flatlay.png</text>
          <text x="397" y="337" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Color: Black</text>
          <text x="718" y="337" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Front</text>
          <text x="908" y="337" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Set</text>
          <text x="1058" y="337" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Complete</text>
        <rect x="64" y="350" width="1152" height="40" rx="0" fill="#ffffff" stroke="#d2d9e1" stroke-width="1" />
          <text x="76" y="377" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">white-flatlay.png</text>
          <text x="397" y="377" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Color: White</text>
          <text x="718" y="377" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Front</text>
          <text x="908" y="377" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Set</text>
          <text x="1058" y="377" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Complete</text>
        <rect x="64" y="390" width="1152" height="40" rx="0" fill="#ffffff" stroke="#d2d9e1" stroke-width="1" />
          <text x="76" y="417" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">navy-flatlay.png</text>
          <text x="397" y="417" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Color: Navy</text>
          <text x="718" y="417" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Front</text>
          <text x="908" y="417" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Set</text>
          <text x="1058" y="417" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Complete</text>
        <rect x="64" y="430" width="1152" height="40" rx="0" fill="#ffffff" stroke="#d2d9e1" stroke-width="1" />
          <text x="76" y="457" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">military-green.png</text>
          <text x="397" y="457" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Not assigned</text>
          <text x="718" y="457" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Front</text>
          <text x="908" y="457" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Not set</text>
          <text x="1058" y="457" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Needs setup</text>
        <rect x="64" y="470" width="1152" height="40" rx="0" fill="#ffffff" stroke="#d2d9e1" stroke-width="1" />
          <text x="76" y="497" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">gray-flatlay.png</text>
          <text x="397" y="497" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Not assigned</text>
          <text x="718" y="497" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Front</text>
          <text x="908" y="497" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Not set</text>
          <text x="1058" y="497" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Needs setup</text>
