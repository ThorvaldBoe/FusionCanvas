        <g data-ui-id="shared-design-area" data-ui-kind="select" data-enabled="true">
          <rect x="652" y="142" width="580" height="38" rx="5" fill="#edf2f7" stroke="#9fb0c3" stroke-width="1" />
          <text x="664" y="166" fill="#26384c" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">Front</text>
          <text x="1210" y="166" fill="#415870" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">▾</text>
        </g>
      </g>
    </g>
    <g data-ui-id="image-collection" data-ui-kind="panel" data-enabled="true">
      <rect x="48" y="196" width="1184" height="358" rx="10" fill="#ffffff" stroke="#b8c4d2" stroke-width="1" />
