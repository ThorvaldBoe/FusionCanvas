      <g data-ui-id="selection-help" data-ui-kind="text" data-enabled="true">
        <text x="64" y="532" fill="#617087" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400">Select an image row to edit its applicability and placement below. Uploading does not assign metadata.</text>
      </g>
